# Local development stack: backend + frontend with one command.
#
#   docker compose up --build     # first run / after requirements.txt or package.json change
#   docker compose up             # every other time
#   docker compose down           # stop
#
# Prerequisites: Docker Desktop running, and backend/.env + frontend/.env filled
# in (copy the .env.example files — see README.md). Supabase is hosted, not a
# container here. Stop any `python main.py` / `npm run dev` you started by hand
# first: they hold ports 3001 / 5173.
services:
  backend:
    build:
      context: ./backend
    container_name: gradenture-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development          # enables uvicorn --reload and CORS for :5173
      WATCHFILES_FORCE_POLLING: "true"   # Windows bind mounts don't forward file events
    volumes:
      # Source is bind-mounted so edits on the host reload the server live.
      - ./backend:/app
      # Hide the host's Windows virtualenvs: the image has its own packages, and
      # polling ~9k venv files over the bind mount stalls the reloader.
      - /app/.venv
      - /app/venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/v1')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    container_name: gradenture-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"    # same reason: Vite HMR on Windows bind mounts
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's own node_modules (installed during
      # build, Linux binaries) isn't shadowed by the host's Windows node_modules.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
